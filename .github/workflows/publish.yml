# Written by mono's ship; a release rewrites it when it differs.
# npm's trusted publisher entry names this file, so keep its path.
name: publish

on:
  workflow_dispatch:
    inputs:
      ref:
        description: The release commit to publish
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest
      - run: bun install --frozen-lockfile
      - run: bun packages/core/ship/npm/cli.ts build packages/vexml
      - run: npm publish ./packages/vexml/dist --access public
