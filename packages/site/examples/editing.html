<!doctype html>
<html lang="en">
  <head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>vexml editing example</title></head>
  <body>
    <h1>Editing with vexml and mdom</h1>
    <p>Click a note. Shift-click to select a range. These buttons run native mdom transactions.</p>
    <button type="button" id="staccato">Add staccato</button>
    <button type="button" id="undo">Undo</button>
    <button type="button" id="redo">Redo</button>
    <p id="status" role="status"></p>
    <div id="score" role="application" aria-label="Score"></div>
    <script type="module" src="./editing.ts"></script>
  </body>
</html>
